[workspace]
resolver = "3"
members = ["crates/core", "crates/device", "apps/simon_says", "apps/timer", "apps/demo", "apps/experiments"]
default-members = ["apps/simon_says", "apps/timer", "apps/demo", "apps/experiments"]

[workspace.package]
# The one place the toolchain version is written down. CI and
# scripts/test.sh read it from here; .devcontainer/Dockerfile repeats it
# because a Dockerfile cannot read it.
rust-version = "1.97.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# mem::forget is generally not safe to do with esp_hal types, especially those
# holding buffers for the duration of a data transfer.
mem_forget = "deny"
# The task stacks are 16 KiB; a large local array on one of them is a bug.
large_stack_frames = "deny"

[profile.dev]
# Unoptimized builds are too slow for the display and sensor loops.
opt-level = "s"

[profile.release]
# Debug info stays out of the flashed image but lets `espflash monitor`
# symbolize panic backtraces.
debug = 2
