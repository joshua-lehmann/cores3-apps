name: Deploy Autoflash to GitHub Pages

on:
  workflow_run:
    workflows: [Publish firmware, CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: autoflash-pages
  cancel-in-progress: false

jobs:
  deploy:
    # Deploy once after trusted main CI or a standalone tagged firmware release.
    # workflow_run executes on the default branch, satisfying Pages protection rules.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       ((github.event.workflow_run.name == 'CI' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main') ||
        github.event.workflow_run.name == 'Publish firmware'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/autoflash/package-lock.json
      - run: npm ci
        working-directory: tools/autoflash
      - run: npm test
        working-directory: tools/autoflash
      - run: npm run build:client
        working-directory: tools/autoflash
        env:
          VITE_GITHUB_PAGES: 'true'
      - name: Mirror public release images for browser access
        working-directory: tools/autoflash
        run: python3 scripts/mirror-releases.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish built site to the Pages source branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          site_dir="$GITHUB_WORKSPACE/tools/autoflash/dist/client"
          touch "$site_dir/.nojekyll"
          git rev-parse HEAD > "$site_dir/build-revision.txt"
          git fetch --no-tags origin gh-pages
          parent="$(git rev-parse FETCH_HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Build a tree from the output only, without changing the main checkout.
          export GIT_INDEX_FILE="$RUNNER_TEMP/pages-publish-index"
          trap 'rm -f "$GIT_INDEX_FILE"' EXIT
          git read-tree --empty
          git --work-tree="$site_dir" add --all -- .
          tree="$(git write-tree)"
          if [ "$tree" != "$(git rev-parse "$parent^{tree}")" ]; then
            commit="$(git commit-tree "$tree" -p "$parent" -m "Publish Autoflash from $(git rev-parse --short HEAD)")"
            # A normal push rejects concurrent updates rather than overwriting them.
            git push origin "$commit:refs/heads/gh-pages"
          fi
          # GITHUB_TOKEN pushes do not trigger branch-based Pages builds themselves.
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
