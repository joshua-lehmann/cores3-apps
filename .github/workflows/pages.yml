name: Deploy Autoflash to GitHub Pages

on:
  workflow_run:
    workflows: [Publish firmware, CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: autoflash-pages
  cancel-in-progress: false

jobs:
  deploy:
    # Deploy once after trusted main CI or a standalone tagged firmware release.
    # workflow_run executes on the default branch, satisfying Pages protection rules.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       ((github.event.workflow_run.name == 'CI' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main') ||
        github.event.workflow_run.name == 'Publish firmware'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/autoflash/package-lock.json
      - run: npm ci
        working-directory: tools/autoflash
      - run: npm test
        working-directory: tools/autoflash
      - run: npm run build:client
        working-directory: tools/autoflash
        env:
          VITE_GITHUB_PAGES: 'true'
      - name: Mirror public release images for browser access
        working-directory: tools/autoflash
        run: python3 scripts/mirror-releases.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tools/autoflash/dist/client
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
