name: Publish firmware

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firmware:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read Rust version
        run: echo "RUST_VERSION=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_ENV"
      - uses: esp-rs/xtensa-toolchain@v1.7
        with:
          default: true
          buildtargets: esp32s3
          version: ${{ env.RUST_VERSION }}.0
          ldproxy: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: esp32s3-firmware
      - name: Install pinned cargo-espflash binary
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/esp-rs/espflash/releases/download/v4.7.0/cargo-espflash-x86_64-unknown-linux-gnu.zip \
            --output /tmp/cargo-espflash.zip
          echo '0d0ca701660942aaed7452a10d59f484f462cdaf038112de520d5c2f1721220e  /tmp/cargo-espflash.zip' | sha256sum --check
          python3 -m zipfile -e /tmp/cargo-espflash.zip /tmp/cargo-espflash-bin
          install -m 755 /tmp/cargo-espflash-bin/cargo-espflash "$HOME/.cargo/bin/cargo-espflash"
          cargo espflash --version
      - name: Build merged images at address 0x0
        run: |
          mkdir -p release-images
          for app in simon_says timer demo; do
            cargo dist --package "$app" --bin "$app"
            mv firmware.bin "release-images/$app.bin"
          done
      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-images/*.bin --clobber
          else
            gh release create "$RELEASE_TAG" release-images/*.bin --generate-notes
          fi
