name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  firmware-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check pushed firmware changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          changed=false
          if [ "$EVENT_NAME" = push ]; then
            changed="$(python3 scripts/next_release.py --changed "$BEFORE" "$AFTER")"
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Test release version selection
        run: python3 -m unittest discover -s scripts -p test_next_release.py

  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read the toolchain version from Cargo.toml
        run: echo "RUST_VERSION=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_ENV"

      - name: Install host Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy

      - name: Lint the core crate and its tests
        run: |
          host_target="$(rustc +"$RUST_VERSION" -vV | sed -n 's/^host: //p')"
          cargo +"$RUST_VERSION" clippy -p cores3-core --all-targets --target "$host_target" -- -D warnings

      - name: Run host tests
        run: RUSTFLAGS="-D warnings" ./scripts/test.sh

  autoflash:
    name: Autoflash checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/autoflash/package-lock.json
      - run: npm ci
        working-directory: tools/autoflash
      - run: npm test
        working-directory: tools/autoflash
      - run: npm run build
        working-directory: tools/autoflash
      - name: Test the Autoflash server
        run: cargo +stable test --locked
        working-directory: tools/autoflash

  firmware:
    name: Firmware lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read the toolchain version from Cargo.toml
        run: echo "RUST_VERSION=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_ENV"

      - name: Install Xtensa Rust toolchain
        uses: esp-rs/xtensa-toolchain@v1.7
        with:
          default: true
          buildtargets: esp32s3
          # The Xtensa toolchain adds a fourth version component.
          version: ${{ env.RUST_VERSION }}.0
          ldproxy: false

      - name: Cache Cargo registry and build tree
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: esp32s3-firmware

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (library and every application binary)
        run: cargo clippy --locked --release -- -D warnings

      - name: Build every application binary
        run: cargo build --locked --release

  publish-firmware:
    needs: [firmware-changes, host-tests, autoflash, firmware]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.firmware-changes.outputs.changed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-firmware.yml
    with:
      automatic: true
